# 04.vue-frontend Deployment
# - Vue 빌드 결과물(정적 파일)을 nginx로 서빙하는 컨테이너를 k8s에 배포하기 위한 정의
# - image 값은 docker-push.sh로 올린 이미지 주소로 바꿔서 사용한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    update: 26c1703a
  name: sk094-vue-frontend
  namespace: class-3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sk094-vue-frontend
  template:
    metadata:
      labels:
        app: sk094-vue-frontend
    spec:
      containers:
        - name: vue-frontend
          image: skala-registry.skala-us.com/class-3/sk094-vue-frontend:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
