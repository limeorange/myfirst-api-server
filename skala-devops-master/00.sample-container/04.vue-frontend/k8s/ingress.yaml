apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
#  annotations:
#    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: sk094-cert-ingress
  namespace: class-3
  labels:
    app: sk094-cert-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: sk094-ingress.class-3.skala-us.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sk094-myfirst-api-server
                port:
                  number: 8080
          - path: /python
            pathType: Prefix
            backend:
              service:
                name: sk094-myfirst-api-server
                port:
                  number: 8080
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: sk094-myfirst-api-server
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sk094-frontend
                port:
                  number: 8080
  tls:
  - hosts:
    - 'sk094-cert-ingress.class-3.skala-us.com'
    secretName: wildcard-class-3-skala-us-com-tls
