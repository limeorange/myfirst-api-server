apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sk094-myapp-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  destination:
    namespace: class-3
    server: https://kubernetes.default.svc
  project: class-3
  source:
    repoURL: https://github.com/himang10/myfirst-api-server.git
    targetRevision: HEAD
    path: .
    helm:
      valueFiles:
        - custom-values.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - PrunePropagationPolicy=background
